site_name: Cinnak's Blog
site_description: Field notes on building maintainable software systems with foundation models
site_url: https://cinnak.github.io/cinnakblog/

theme:
  name: material
  custom_dir: 'overrides'
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight
    - comments  # Enable the comments feature
  palette:  # Ensure palette is directly under theme
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

nav:
  - Home: index.md
  - Blog:
    - blog/index.md
  - Now: now.md

repo_name: cinnak/cinnakblog
repo_url: https://github.com/cinnak/cinnakblog

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.magiclink # Keep this if needed
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - meta
  # Removed comments section from here

plugins:
  - search
  - material/blog: # Use Material for MkDocs built-in blog plugin
      archive_date_format: "YYYY" # Changed format to Month Year
      post_excerpt: required
  - tags
